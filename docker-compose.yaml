services:
  db:
    image: postgres:16-alpine
    container_name: token-soup-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: token_soup
    # No named volume: data lives in the container and is removed with `compose down -v`.
    volumes:
      - ./docker/postgres/01-auth-stub.sql:/docker-entrypoint-initdb.d/01-auth-stub.sql:ro
      - ./supabase/schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d token_soup"]
      interval: 1s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ./api
    image: token-soup-api:dev
    container_name: token-soup-api
    ports:
      - "8080:8080"
    command: ["-mode", "local", "-addr", ":8080"]
    # OPENROUTER_API_KEY and PUBLIC_* limits (copy api/.env.example → api/.env).
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/token_soup?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
